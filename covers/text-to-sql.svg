<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Text-to-SQL: doğal dil sorusu, şema bağlamı, üretilen SQL, doğrulama katmanı ve salt okunur veritabanı erişimi">
  <rect width="800" height="420" fill="#12140e"/>
  <circle cx="90" cy="70" r="150" fill="#a9c94a" opacity=".06"/>
  <text x="48" y="70" font-family="'Space Grotesk',system-ui,sans-serif" font-size="30" font-weight="600" fill="#e9eade">Doğal dilden SQL'e</text>
  <text x="48" y="98" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#a2a795">Şema bağlamı · doğrulama · salt okunur erişim</text>

  <!-- Soru balonu -->
  <g transform="translate(48,140)">
    <rect width="250" height="66" rx="14" fill="#1b1e16" stroke="#333829"/>
    <path d="M28 66 l0 18 l20 -18 z" fill="#1b1e16" stroke="#333829"/>
    <text x="20" y="32" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#e9eade">“Geçen çeyrekte en çok</text>
    <text x="20" y="52" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#e9eade">satan 5 ürün hangisi?”</text>
  </g>

  <!-- SQL kutusu -->
  <g transform="translate(48,246)">
    <rect width="380" height="126" rx="12" fill="#1b1e16" stroke="#a9c94a" stroke-opacity=".55"/>
    <g font-family="ui-monospace,Menlo,monospace" font-size="13.5">
      <text x="18" y="32" fill="#a9c94a">SELECT</text><text x="72" y="32" fill="#e9eade">urun, SUM(adet) AS toplam</text>
      <text x="18" y="56" fill="#a9c94a">FROM</text><text x="62" y="56" fill="#e9eade">satislar</text>
      <text x="18" y="80" fill="#a9c94a">WHERE</text><text x="72" y="80" fill="#e9eade">tarih &gt;= :ceyrek_baslangic</text>
      <text x="18" y="104" fill="#a9c94a">GROUP BY</text><text x="98" y="104" fill="#e9eade">urun ORDER BY toplam DESC</text>
    </g>
  </g>

  <!-- Doğrulama kapısı -->
  <g transform="translate(470,196)">
    <rect width="132" height="132" rx="18" fill="#232720" stroke="#a9c94a"/>
    <path d="M66 34 l30 13 v24 c0 20 -13 33 -30 40 c-17 -7 -30 -20 -30 -40 V47 z" fill="none" stroke="#a9c94a" stroke-width="2.5"/>
    <path d="M54 82 l9 10 l19 -22" fill="none" stroke="#a9c94a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="156" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#a2a795">Doğrulama</text>
  </g>

  <!-- Veritabanı -->
  <g transform="translate(652,206)">
    <ellipse cx="50" cy="15" rx="50" ry="15" fill="#232720" stroke="#a9c94a" stroke-opacity=".6"/>
    <path d="M0 15 V84 a50 15 0 0 0 100 0 V15" fill="#1b1e16" stroke="#a9c94a" stroke-opacity=".6"/>
    <ellipse cx="50" cy="49" rx="50" ry="15" fill="none" stroke="#333829"/>
    <text x="50" y="146" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#a2a795">Salt okunur</text>
  </g>

  <g stroke="#a9c94a" stroke-width="2.5" fill="none" marker-end="url(#a3)">
    <line x1="436" y1="262" x2="462" y2="262"/>
    <line x1="610" y1="262" x2="644" y2="262"/>
  </g>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a9c94a"/>
    </marker>
  </defs>
</svg>
